[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-servers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp-slim[server]>=3.4.2",
    "paramiko>=5.1.0",
    "prometheus-client>=0.25.0",
    "psycopg2-binary>=2.9.12",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.50",
]

[tool.hatch.build.targets.wheel]
packages = ["shared", "servers"]
