apiVersion: v1
kind: Secret
metadata:
  name: mcp-remote-server-manager-secrets
  namespace: mcp-remote-server-manager
type: Opaque
stringData:
  # Hosts the agent can manage, in TOML: one [name] table per host. See the server README for all settings.
  # host_key is the server's public key: run 'cat /etc/ssh/ssh_host_ed25519_key.pub' on the server.
  HOSTS: |
    [web-01]
    address = "192.168.1.10"
    username = "mcp"
    host_key = "ssh-ed25519 AAAA..."
    sudo = true
    restartable_services = ["nginx"]

    [db-01]
    address = "10.0.0.20"
    username = "mcp"
    password = "CHANGE ME"
    host_key = "ssh-ed25519 AAAA..."

  # Private key for hosts without a password (unencrypted Ed25519, ECDSA or RSA). Leave out if all hosts use passwords.
  SSH_PRIVATE_KEY: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ...
    -----END OPENSSH PRIVATE KEY-----
