apiVersion: v1
kind: Secret
metadata:
  name: mcp-remote-server-manager-secrets
  namespace: mcp-remote-server-manager
type: Opaque
stringData:
  PG_USER: "DATABASE USERNAME"
  PG_PASSWORD: "DATABASE PASSWORD"
  PG_HOSTNAME: "DATABASE HOSTNAME"
  PG_DATABASE: "DATABASE NAME"

  # Comma-separated IP addresses and/or CIDR ranges that SSH sessions may be created with.
  # Hostnames are resolved and their IP is checked against this list. Leave empty to allow all hosts.
  ALLOWED_HOSTS: "192.168.1.10,10.0.0.0/24"
